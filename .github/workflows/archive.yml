name: Archive Horizon
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/archive.yml']
permissions:
  contents: write
concurrency:
  group: horizon-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive history and verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python tools/mirror_horizon.py
