name: Archive Horizon
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/archive.yml']
permissions:
  contents: write
concurrency:
  group: horizon-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive history and verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python tools/mirror_horizon.py
      # GitHub disables schedules in public repos after 60 idle days. If upstream goes quiet
      # or disappears, a monthly heartbeat keeps the hourly archive armed.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .commit.committer.date)
          if [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt $(( 40 * 86400 )) ]; then exit 0; fi
          gh auth setup-git
          git config user.name 'Horizon archive'
          git config user.email 'horizon-archive@users.noreply.github.com'
          git pull --ff-only "https://github.com/${GITHUB_REPOSITORY}.git" main
          date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
          git add .heartbeat
          git commit -m 'Keep archive schedule active'
          git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
